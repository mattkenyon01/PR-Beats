<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR beats</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #111;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #e8eef5 0%, transparent 55%),
        linear-gradient(180deg, #f7f8fa 0%, #eef1f4 100%);
    }

    .coming-soon {
      text-align: center;
      padding: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    p {
      margin: 0.75rem 0 0;
      font-size: 1.125rem;
      opacity: 0.65;
    }
  </style>
</head>
<body>
  <div class="coming-soon">
    <h1>PR beats</h1>
    <p>page being built</p>
  </div>
</body>
</html>
