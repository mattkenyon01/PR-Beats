<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR beats</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="public-page">
  <div class="public-app">
    <header class="public-header">
      <h1>PR beats</h1>
      <p class="lede">Announcement coverage</p>
    </header>

    <p class="note" id="status">Loading…</p>
    <div class="announcement-carousel" id="carousel" hidden tabindex="0">
      <div class="carousel-slide" id="carousel-slide" aria-live="polite">
        <h2 class="carousel-game" id="carousel-game"></h2>
        <ul class="carousel-announcements" id="carousel-announcements"></ul>
      </div>
      <div
        class="carousel-dots"
        id="carousel-dots"
        role="tablist"
        aria-label="Games"
      ></div>
    </div>
  </div>

  <a class="admin-link" href="login.html">Admin</a>

  <script type="module">
    import { loadPublicAnnouncements } from "./js/api.js";

    const statusEl = document.getElementById("status");
    const carouselEl = document.getElementById("carousel");
    const gameEl = document.getElementById("carousel-game");
    const announcementsEl = document.getElementById("carousel-announcements");
    const dotsEl = document.getElementById("carousel-dots");

    let groups = [];
    let activeIndex = 0;
    let touchStartX = 0;

    function groupByGame(rows) {
      const map = new Map();
      rows.forEach((row) => {
        const key = (row.gameTitle || "").trim() || "Untitled";
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(row);
      });
      return [...map.entries()].sort((a, b) =>
        a[0].localeCompare(b[0], undefined, {
          sensitivity: "base",
          numeric: true,
        })
      );
    }

    function showSlide(index) {
      if (!groups.length) return;

      activeIndex = ((index % groups.length) + groups.length) % groups.length;
      const [gameTitle, entries] = groups[activeIndex];

      gameEl.textContent = gameTitle;
      announcementsEl.innerHTML = "";
      entries.forEach((row) => {
        const li = document.createElement("li");
        const title = (row.announcementTitle || "").trim();
        li.textContent = title || "No announcement title";
        if (!title) li.classList.add("is-empty");
        announcementsEl.appendChild(li);
      });

      [...dotsEl.children].forEach((dot, i) => {
        const isActive = i === activeIndex;
        dot.classList.toggle("is-active", isActive);
        dot.setAttribute("aria-selected", isActive ? "true" : "false");
        dot.tabIndex = isActive ? 0 : -1;
      });
    }

    function render(rows) {
      groups = groupByGame(rows);

      if (!groups.length) {
        carouselEl.hidden = true;
        const params = new URLSearchParams(window.location.search);
        const filtered =
          params.has("game") ||
          params.has("games") ||
          params.has("month") ||
          params.has("months") ||
          params.has("s");
        statusEl.hidden = false;
        statusEl.textContent = filtered
          ? "No announcements match this filter."
          : "No announcements published yet.";
        return;
      }

      statusEl.hidden = true;
      carouselEl.hidden = false;
      dotsEl.innerHTML = "";

      groups.forEach(([gameTitle], index) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "carousel-dot";
        dot.setAttribute("role", "tab");
        dot.setAttribute("aria-label", gameTitle);
        dot.addEventListener("click", () => showSlide(index));
        dotsEl.appendChild(dot);
      });

      showSlide(0);
    }

    carouselEl.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        event.preventDefault();
        showSlide(activeIndex + 1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        showSlide(activeIndex - 1);
      }
    });

    carouselEl.addEventListener(
      "touchstart",
      (event) => {
        touchStartX = event.changedTouches[0]?.clientX ?? 0;
      },
      { passive: true }
    );

    carouselEl.addEventListener(
      "touchend",
      (event) => {
        const touchEndX = event.changedTouches[0]?.clientX ?? 0;
        const delta = touchEndX - touchStartX;
        if (Math.abs(delta) < 40) return;
        showSlide(activeIndex + (delta < 0 ? 1 : -1));
      },
      { passive: true }
    );

    try {
      const data = await loadPublicAnnouncements(window.location.search);
      render(data.rows || []);
    } catch (error) {
      statusEl.hidden = false;
      statusEl.textContent =
        error instanceof Error
          ? error.message
          : "Could not load announcements.";
      statusEl.classList.add("is-error");
    }
  </script>
</body>
</html>
