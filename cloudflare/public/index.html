<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR beats</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="public-page">
  <div class="public-app">
    <header class="public-header">
      <h1>PR beats</h1>
      <p class="lede">Announcement coverage</p>
    </header>

    <p class="note" id="status">Loading…</p>
    <div class="game-sections" id="game-sections"></div>
  </div>

  <a class="admin-link" href="login.html">Admin</a>

  <script type="module">
    import { loadPublicAnnouncements } from "./js/api.js";

    const PLATFORM_OPTIONS = [
      { id: "steam", label: "Steam", icon: "images/Steam Icon.webp" },
      { id: "switch2", label: "Switch 2", icon: "images/Switch 2 Icon.webp" },
      { id: "switch", label: "Switch", icon: "images/Switch Icon.png" },
      { id: "xbox", label: "Xbox", icon: "images/Xbox.png" },
    ];

    const COLUMNS = [
      { key: "announcementTitle", label: "Announcement Title" },
      { key: "date", label: "Date" },
      { key: "month", label: "Month" },
      { key: "platforms", label: "Platforms" },
      { key: "trailer", label: "Trailer" },
      { key: "pressReleasePdf", label: "Press Release PDF Space" },
      { key: "estimatedReach", label: "Estimated Reach" },
      { key: "highlights", label: "Highlights" },
      { key: "totalWishlists", label: "Total Wishlists" },
    ];

    const statusEl = document.getElementById("status");
    const sectionsEl = document.getElementById("game-sections");

    function parsePlatformIds(value) {
      return String(value || "")
        .split(/[,|;/]+/)
        .map((part) => part.trim())
        .filter(Boolean);
    }

    function renderPlatforms(value) {
      const wrap = document.createElement("div");
      wrap.className = "platform-chips readonly";

      const ids = parsePlatformIds(value);
      if (ids.length === 0) {
        wrap.textContent = "—";
        wrap.classList.add("muted");
        return wrap;
      }

      ids.forEach((id) => {
        const option = PLATFORM_OPTIONS.find((item) => item.id === id);
        if (!option) return;
        const img = document.createElement("img");
        img.className = "platform-icon";
        img.src = option.icon;
        img.alt = option.label;
        img.title = option.label;
        wrap.appendChild(img);
      });

      if (!wrap.children.length) {
        wrap.textContent = value || "—";
      }

      return wrap;
    }

    function renderLinkOrText(value) {
      const text = String(value || "").trim();
      if (!text) {
        const span = document.createElement("span");
        span.className = "muted";
        span.textContent = "—";
        return span;
      }

      if (/^https?:\/\//i.test(text)) {
        const a = document.createElement("a");
        a.href = text;
        a.target = "_blank";
        a.rel = "noreferrer";
        a.textContent = "Open";
        return a;
      }

      return document.createTextNode(text);
    }

    function groupByGame(rows) {
      const groups = new Map();
      rows.forEach((row) => {
        const key = (row.gameTitle || "").trim() || "Untitled";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(row);
      });
      return [...groups.entries()].sort((a, b) =>
        a[0].localeCompare(b[0], undefined, {
          sensitivity: "base",
          numeric: true,
        })
      );
    }

    function render(rows) {
      sectionsEl.innerHTML = "";

      if (!rows.length) {
        const params = new URLSearchParams(window.location.search);
        const filtered = params.has("game") || params.has("games");
        statusEl.textContent = filtered
          ? "No announcements match this filter."
          : "No announcements published yet.";
        return;
      }

      statusEl.hidden = true;
      const groups = groupByGame(rows);

      groups.forEach(([gameTitle, entries]) => {
        const section = document.createElement("section");
        section.className = "game-section";

        const heading = document.createElement("h2");
        heading.className = "game-section-title";
        heading.textContent = gameTitle;
        section.appendChild(heading);

        const meta = document.createElement("p");
        meta.className = "game-section-meta";
        meta.textContent = `${entries.length} announcement${entries.length === 1 ? "" : "s"}`;
        section.appendChild(meta);

        const wrap = document.createElement("div");
        wrap.className = "table-wrap";

        const table = document.createElement("table");
        table.className = "readonly-table";

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        COLUMNS.forEach((column) => {
          const th = document.createElement("th");
          th.textContent = column.label;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);

        const tbody = document.createElement("tbody");
        entries.forEach((row) => {
          const tr = document.createElement("tr");
          COLUMNS.forEach((column) => {
            const td = document.createElement("td");
            const value = row[column.key];

            if (column.key === "platforms") {
              td.appendChild(renderPlatforms(value));
            } else if (
              column.key === "trailer" ||
              column.key === "pressReleasePdf"
            ) {
              td.appendChild(renderLinkOrText(value));
            } else {
              const text = String(value || "").trim();
              td.textContent = text || "—";
              if (!text) td.classList.add("muted");
            }

            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });

        table.appendChild(thead);
        table.appendChild(tbody);
        wrap.appendChild(table);
        section.appendChild(wrap);
        sectionsEl.appendChild(section);
      });
    }

    try {
      const data = await loadPublicAnnouncements(window.location.search);
      render(data.rows || []);
    } catch (error) {
      statusEl.textContent =
        error instanceof Error
          ? error.message
          : "Could not load announcements.";
      statusEl.classList.add("is-error");
    }
  </script>
</body>
</html>
