    const PLATFORM_OPTIONS = [
      { id: "steam", label: "Steam", icon: "images/Steam Icon.webp" },
      { id: "switch2", label: "Switch 2", icon: "images/Switch 2.png" },
      { id: "switch", label: "Switch", icon: "images/Switch Icon.png" },
      { id: "xbox", label: "Xbox", icon: "images/Xbox.png" },
      { id: "ps5", label: "PS5", icon: "images/PS.jpg" },
      { id: "ps4", label: "PS4", icon: "images/PS.jpg" },
    ];

    let slides = [];
    let activeIndex = 0;
    let touchStartX = 0;

    function parsePlatforms(value) {
      const text = String(value || "").toLowerCase();
      if (!text.trim()) return [];

      const selected = [];
      const ordered = [
        { id: "switch2", patterns: ["switch 2", "switch2", "nsw2"] },
        { id: "switch", patterns: ["nintendo switch", "switch", "nsw"] },
        { id: "steam", patterns: ["steam", "pc"] },
        { id: "xbox", patterns: ["xbox", "series x", "series s"] },
        { id: "ps5", patterns: ["ps5", "ps 5", "playstation 5", "playstation5"] },
        { id: "ps4", patterns: ["ps4", "ps 4", "playstation 4", "playstation4"] },
      ];

      ordered.forEach((option) => {
        if (option.patterns.some((pattern) => text.includes(pattern))) {
          if (option.id === "switch" && selected.includes("switch2")) return;
          selected.push(option.id);
        }
      });

      PLATFORM_OPTIONS.forEach((option) => {
        if (
          text
            .split(/[,|;/]+/)
            .map((part) => part.trim())
            .includes(option.id) &&
          !selected.includes(option.id)
        ) {
          selected.push(option.id);
        }
      });

      return selected;
    }

    function platformsForEntries(entries) {
      const ids = [];
      entries.forEach((row) => {
        parsePlatforms(row.platforms).forEach((id) => {
          if (!ids.includes(id)) ids.push(id);
        });
      });
      return PLATFORM_OPTIONS.filter((option) => ids.includes(option.id));
    }

    function syncDetailCardSizes() {
      if (!detailCardsEl || !detailCardPlatformsEl) return;
      // Side-by-cover layout sizes by cover height (CSS fr rows) — do not
      // force every card to Platforms height or the stack overflows the cover.
      detailCardsEl.style.removeProperty("--detail-card-min-height");
      if (detailCardsEl.closest(".carousel-hero")) return;
      const height = Math.ceil(
        detailCardPlatformsEl.getBoundingClientRect().height
      );
      if (height > 0) {
        detailCardsEl.style.setProperty(
          "--detail-card-min-height",
          `${height}px`
        );
      }
    }

    function scheduleSyncDetailCardSizes() {
      requestAnimationFrame(() => {
        syncDetailCardSizes();
        // Second pass after icons/fonts settle.
        requestAnimationFrame(syncDetailCardSizes);
      });
    }

    function ensureDetailCardSizeObserver() {
      if (!detailCardPlatformsEl || detailCardSizeObserver) return;
      if (typeof ResizeObserver === "function") {
        detailCardSizeObserver = new ResizeObserver(() => {
          syncDetailCardSizes();
        });
        detailCardSizeObserver.observe(detailCardPlatformsEl);
      }
      window.addEventListener("resize", scheduleSyncDetailCardSizes);
    }

    function setPlatforms(entries) {
      announcementPlatformsEl.innerHTML = "";
      const platforms = platformsForEntries(entries);

      if (!platforms.length) {
        announcementPlatformsEl.classList.add("muted");
        const empty = document.createElement("span");
        empty.className = "detail-card-list is-empty";
        empty.textContent = "No platforms";
        empty.style.fontStyle = "italic";
        empty.style.opacity = "0.45";
        announcementPlatformsEl.appendChild(empty);
        scheduleSyncDetailCardSizes();
        return;
      }

      announcementPlatformsEl.classList.remove("muted");
      platforms.forEach((option) => {
        const item = document.createElement("div");
        item.className = "platform-entry";

        const img = document.createElement("img");
        img.className = "platform-icon";
        img.src = option.icon;
        img.alt = "";
        img.addEventListener("load", scheduleSyncDetailCardSizes, {
          once: true,
        });
        item.appendChild(img);

        const name = document.createElement("span");
        name.className = "platform-name";
        name.textContent = option.label;
        item.appendChild(name);

        announcementPlatformsEl.appendChild(item);
      });
      ensureDetailCardSizeObserver();
      scheduleSyncDetailCardSizes();
    }

    function youtubeEmbedUrl(value) {
      const raw = String(value || "").trim();
      if (!raw) return "";

      try {
        const url = new URL(raw);
        const host = url.hostname.replace(/^www\./, "").toLowerCase();

        if (host === "youtu.be") {
          const id = url.pathname.split("/").filter(Boolean)[0] || "";
          return id ? `https://www.youtube.com/embed/${id}` : "";
        }

        if (host === "youtube.com" || host === "m.youtube.com" || host === "youtube-nocookie.com") {
          if (url.pathname.startsWith("/embed/")) {
            const id = url.pathname.split("/")[2] || "";
            return id ? `https://www.youtube.com/embed/${id}` : "";
          }
          if (url.pathname.startsWith("/shorts/")) {
            const id = url.pathname.split("/")[2] || "";
            return id ? `https://www.youtube.com/embed/${id}` : "";
          }
          const id = url.searchParams.get("v");
          return id ? `https://www.youtube.com/embed/${id}` : "";
        }
      } catch {
        /* not a URL — try bare video id */
      }

      if (/^[\w-]{11}$/.test(raw)) {
        return `https://www.youtube.com/embed/${raw}`;
      }

      return "";
    }

    function setTrailer(entries) {
      const embedUrl = entries
        .map((row) => youtubeEmbedUrl(row.trailer))
        .find(Boolean);

      const existing = trailerEmbedEl.querySelector("iframe");
      if (existing) existing.remove();

      if (embedUrl) {
        const iframe = document.createElement("iframe");
        iframe.src = embedUrl;
        iframe.title = "Game trailer";
        iframe.allow =
          "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.allowFullscreen = true;
        iframe.referrerPolicy = "strict-origin-when-cross-origin";
        trailerEmbedEl.appendChild(iframe);
        trailerPlaceholderEl.hidden = true;
        trailerCardEl.classList.remove("is-empty");
      } else {
        trailerPlaceholderEl.hidden = false;
        trailerCardEl.classList.add("is-empty");
      }
    }

    function pdfEmbedUrl(value, { toolbar = true } = {}) {
      const raw = String(value || "").trim();
      if (!raw) return "";

      try {
        const url = new URL(raw);
        const host = url.hostname.replace(/^www\./, "").toLowerCase();

        // Google Drive share/view links → preview embed
        if (host === "drive.google.com") {
          const fileMatch = url.pathname.match(/\/file\/d\/([^/]+)/);
          const id = fileMatch?.[1] || url.searchParams.get("id");
          return id ? `https://drive.google.com/file/d/${id}/preview` : raw;
        }

        return withPdfViewerChrome(url.href, { toolbar });
      } catch {
        return "";
      }
    }

    /** Chrome/Edge/Firefox PDF viewers: hide toolbar + fit width in the card preview. */
    function withPdfViewerChrome(href, { toolbar = true } = {}) {
      try {
        const url = new URL(href);
        const host = url.hostname.replace(/^www\./, "").toLowerCase();
        if (host === "drive.google.com" || host === "docs.google.com") {
          return url.href;
        }

        const parts = String(url.hash || "")
          .replace(/^#/, "")
          .split("&")
          .map((part) => part.trim())
          .filter(Boolean)
          .filter(
            (part) =>
              !/^toolbar=/i.test(part) &&
              !/^navpanes=/i.test(part) &&
              !/^scrollbar=/i.test(part) &&
              !/^zoom=/i.test(part) &&
              !/^view=/i.test(part)
          );

        if (!toolbar) {
          // Fit page width to the iframe (slightly inset via CSS).
          parts.push("toolbar=0", "navpanes=0", "scrollbar=0", "page=1", "view=FitH");
        }

        const base = `${url.origin}${url.pathname}${url.search}`;
        return parts.length ? `${base}#${parts.join("&")}` : base;
      } catch {
        return href;
      }
    }

    function extractUrls(value) {
      const text = String(value || "");
      const matches = text.match(/https?:\/\/[^\s<>"')\]]+/gi) || [];
      return [
        ...new Set(
          matches.map((url) => url.replace(/[.,;:!?)]+$/g, "")).filter(Boolean)
        ),
      ];
    }

    function faviconUrl(url) {
      try {
        return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(
          new URL(url).hostname
        )}&sz=128`;
      } catch {
        return "";
      }
    }

    function loadImageWithFallback(imgEl, src, { onSuccess, onFail } = {}) {
      const image = String(src || "").trim();
      if (!image || !imgEl) {
        onFail?.();
        return;
      }
      const proxied = linkPreviewImageUrl(image);
      const tryLoad = (finalSrc, allowProxyFallback) => {
        imgEl.referrerPolicy = "no-referrer";
        imgEl.decoding = "async";
        imgEl.onload = () => {
          onSuccess?.(finalSrc);
        };
        imgEl.onerror = () => {
          if (allowProxyFallback && proxied && finalSrc !== proxied) {
            tryLoad(proxied, false);
            return;
          }
          onFail?.();
        };
        imgEl.src = finalSrc;
      };
      tryLoad(image, true);
    }

    function showFaviconInCover(anchor) {
      if (!anchor) return;
      const coverEl = anchor.querySelector(".coverage-link-cover");
      const coverImg = coverEl?.querySelector(".coverage-link-cover-image");
      const placeholder = coverEl?.querySelector(".coverage-link-cover-empty");
      const icon = faviconUrl(anchor.href);
      if (!coverEl || !coverImg) return;

      if (!icon) {
        coverImg.hidden = true;
        coverImg.removeAttribute("src");
        coverEl.classList.remove("is-favicon");
        if (placeholder) placeholder.hidden = false;
        return;
      }

      coverEl.classList.add("is-favicon");
      coverEl._coverLoaded = false;
      coverImg.referrerPolicy = "no-referrer";
      coverImg.onload = () => {
        coverImg.hidden = false;
        if (placeholder) placeholder.hidden = true;
      };
      coverImg.onerror = () => {
        coverImg.hidden = true;
        coverImg.removeAttribute("src");
        coverEl.classList.remove("is-favicon");
        if (placeholder) placeholder.hidden = false;
      };
      coverImg.src = icon;
    }

    function applyCoverToAnchor(anchor, imageUrl, { workingSrc = "" } = {}) {
      if (!anchor) return;
      const coverEl = anchor.querySelector(".coverage-link-cover");
      const coverImg = coverEl?.querySelector(".coverage-link-cover-image");
      const placeholder = coverEl?.querySelector(".coverage-link-cover-empty");
      const src = String(workingSrc || imageUrl || "").trim();
      if (!coverEl || !coverImg || !src) return;

      const current =
        String(coverImg.getAttribute("src") || "").trim() ||
        String(anchor.dataset.coverImage || "").trim();
      if (
        coverEl._coverLoaded &&
        !coverEl.classList.contains("is-favicon") &&
        (current === src || current === imageUrl) &&
        !coverImg.hidden
      ) {
        return;
      }

      const requestId = (coverEl._previewRequestId || 0) + 1;
      coverEl._previewRequestId = requestId;
      const isCurrent = () => coverEl._previewRequestId === requestId;

      coverEl.classList.remove("is-favicon");
      anchor.dataset.coverImage = String(imageUrl || src).trim();
      loadImageWithFallback(coverImg, src, {
        onSuccess: (finalSrc) => {
          if (!isCurrent()) return;
          coverEl._coverLoaded = true;
          coverEl.classList.remove("is-favicon");
          coverImg.hidden = false;
          placeholder.hidden = true;
          anchor.dataset.coverImage = String(imageUrl || finalSrc).trim();
          if (finalSrc.startsWith("http")) {
            anchor.dataset.coverWorkingSrc = finalSrc;
          }
        },
        onFail: () => {
          if (!isCurrent() || coverEl._coverLoaded) return;
          showFaviconInCover(anchor);
        },
      });
    }

    function applyPreviewToAnchor(anchor, preview = {}) {
      if (!anchor) return;
      const image = String(preview?.image || "").trim();
      const previewTitle = String(preview?.title || "").trim();
      const titleEl = anchor.querySelector(".coverage-link-title");

      if (image) applyCoverToAnchor(anchor, image);
      else if (!anchor.dataset.coverImage) {
        showFaviconInCover(anchor);
      }

      if (titleEl && !anchor.dataset.previewTitle && previewTitle) {
        titleEl.textContent = previewTitle;
        anchor.dataset.previewTitle = previewTitle;
      }
    }

    async function fillCoverageLinkMedia(coverEl, titleEl, item) {
      const url = String(item?.url || "").trim();
      const storedCover = String(item?.coverImage || "").trim();
      const anchor = coverEl.closest("a.coverage-link");
      const placeholder = coverEl.querySelector(".coverage-link-cover-empty");
      const storedTitle = String(item?.title || "").trim();

      if (!url || !/^https?:\/\//i.test(url)) {
        if (placeholder) placeholder.hidden = false;
        return;
      }

      if (storedCover && anchor) {
        applyCoverToAnchor(anchor, storedCover);
      } else if (anchor) {
        showFaviconInCover(anchor);
      }

      const applyPreview = (preview) => {
        if (anchor) applyPreviewToAnchor(anchor, preview);
        else if (preview?.image) {
          applyCoverToAnchor(
            coverEl.closest("a"),
            String(preview.image || "").trim()
          );
        }
        if (titleEl && !storedTitle) {
          const previewTitle = String(preview?.title || "").trim();
          if (previewTitle) titleEl.textContent = previewTitle;
        }
      };

      if (linkPreviewCache.has(url)) {
        applyPreview(linkPreviewCache.get(url));
        return;
      }

      try {
        const preview = await fetchLinkPreview(url);
        linkPreviewCache.set(url, preview);
        applyPreview(preview);
      } catch {
        if (!storedCover && anchor && !coverEl._coverLoaded) {
          showFaviconInCover(anchor);
        }
      }
    }

    function collectLinksFromValues(values, { includeHighlights = false, rows = [] } = {}) {
      const links = [];
      const seen = new Set();
      let sectionTitle = "";
      let foundCustomTitle = false;

      values.forEach((raw) => {
        const title = parseCoverageSectionTitle(raw);
        if (!foundCustomTitle && title) {
          sectionTitle = title;
          foundCustomTitle = true;
        }
        parseCoverageLinksValue(raw).forEach((item) => {
          const url = String(item.url || "").trim();
          if (!/^https?:\/\//i.test(url) || seen.has(url.toLowerCase())) return;
          seen.add(url.toLowerCase());
          links.push(item);
        });
      });

      if (includeHighlights) {
        rows.forEach((row) => {
          coverageLinkUrls(row.highlights).forEach((url) => {
            if (seen.has(url.toLowerCase())) return;
            seen.add(url.toLowerCase());
            links.push({ url, outletName: "", title: "" });
          });
        });
      }

      links.sort(
        (a, b) =>
          coverageStatSortValue(b.outletStats) -
          coverageStatSortValue(a.outletStats)
      );

      return { links, sectionTitle };
    }

    function renderCoverageLinkCards(gridEl, headingEl, links, {
      sectionTitle,
      emptyLabel = "No links",
      hideWhenEmpty = false,
      sectionEl = null,
    } = {}) {
      if (!gridEl) return;
      gridEl.innerHTML = "";

      const title = sectionTitle || "Links";
      if (headingEl) {
        headingEl.textContent = title;
      }

      if (sectionEl) {
        sectionEl.hidden = hideWhenEmpty && links.length === 0;
      }

      if (!links.length) {
        const empty = document.createElement("p");
        empty.className = "coverage-links-empty";
        empty.textContent = emptyLabel;
        gridEl.appendChild(empty);
        return;
      }

      links.forEach((item) => {
        const anchor = document.createElement("a");
        anchor.className = "coverage-link";
        anchor.href = item.url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";

        const outletText =
          String(item.outletName || "").trim() || coverageLinkDisplayLabel(item);
        const titleText = String(item.title || "").trim();
        const coverImage = String(item.coverImage || "").trim();
        const statsText = formatCoverageStat(item.outletStats);
        const dateText = String(item.date || "").trim();
        const country = String(item.outletCountry || "").trim();
        const flagSrc = countryFlagUrl(country);
        if (titleText) anchor.dataset.previewTitle = titleText;
        if (coverImage) anchor.dataset.coverImage = coverImage;

        const cover = document.createElement("div");
        cover.className = "coverage-link-cover";
        cover._previewRequestId = 0;
        const coverImg = document.createElement("img");
        coverImg.className = "coverage-link-cover-image";
        coverImg.alt = "";
        coverImg.hidden = true;
        const coverEmpty = document.createElement("span");
        coverEmpty.className = "coverage-link-cover-empty";
        coverEmpty.textContent = "No cover";
        cover.appendChild(coverImg);
        cover.appendChild(coverEmpty);

        const outlet = document.createElement("p");
        outlet.className = "coverage-link-outlet";
        outlet.textContent = outletText || "Outlet";

        const titleEl = document.createElement("p");
        titleEl.className = "coverage-link-title";
        titleEl.textContent = titleText || outletText || "Coverage link";

        anchor.appendChild(outlet);
        anchor.appendChild(cover);
        anchor.appendChild(titleEl);

        const footer = document.createElement("div");
        footer.className = "coverage-link-footer";

        if (dateText) {
          const dateBlock = document.createElement("div");
          dateBlock.className = "coverage-link-stat";
          const dateLabel = document.createElement("span");
          dateLabel.className = "coverage-link-stat-label";
          dateLabel.textContent = "Date";
          const dateValue = document.createElement("span");
          dateValue.className = "coverage-link-stat-value";
          dateValue.textContent = dateText;
          dateBlock.appendChild(dateLabel);
          dateBlock.appendChild(dateValue);
          footer.appendChild(dateBlock);
        }

        if (country) {
          const countryBlock = document.createElement("div");
          countryBlock.className = "coverage-link-stat";
          const countryLabel = document.createElement("span");
          countryLabel.className = "coverage-link-stat-label";
          countryLabel.textContent = "Country";
          const countryValue = document.createElement("div");
          countryValue.className = "coverage-link-country-value";
          if (flagSrc) {
            const flag = document.createElement("div");
            flag.className = "coverage-link-flag";
            flag.title = country;
            const flagImg = document.createElement("img");
            flagImg.src = flagSrc;
            flagImg.alt = country;
            flagImg.loading = "lazy";
            flagImg.referrerPolicy = "no-referrer";
            flag.appendChild(flagImg);
            countryValue.appendChild(flag);
          }
          const countryName = document.createElement("span");
          countryName.className = "coverage-link-stat-value";
          countryName.textContent = country;
          countryValue.appendChild(countryName);
          countryBlock.appendChild(countryLabel);
          countryBlock.appendChild(countryValue);
          footer.appendChild(countryBlock);
        }

        if (statsText) {
          const stats = document.createElement("div");
          stats.className = "coverage-link-stat";
          const statsLabel = document.createElement("span");
          statsLabel.className = "coverage-link-stat-label";
          statsLabel.textContent = "Outlet stats";
          const statsValue = document.createElement("span");
          statsValue.className = "coverage-link-stat-value";
          statsValue.textContent = statsText;
          stats.appendChild(statsLabel);
          stats.appendChild(statsValue);
          footer.appendChild(stats);
        }

        if (footer.childElementCount) anchor.appendChild(footer);

        gridEl.appendChild(anchor);
        fillCoverageLinkMedia(cover, titleEl, item);
      });
    }

    function setCoverageLinks(entries) {
      const { links } = collectLinksFromValues(
        entries.map((row) => row.coverageLinks),
        { includeHighlights: true, rows: entries }
      );
      renderCoverageLinkCards(
        coverageLinksGridEl,
        coverageLinksHeadingEl,
        links,
        {
          sectionTitle: "Campaign Coverage",
          emptyLabel: "No coverage links",
        }
      );
    }

    function rowsForGameTitle(gameTitle) {
      const key = String(gameTitle || "").trim() || "Untitled";
      return allPublicRows.filter(
        (row) => ((row.gameTitle || "").trim() || "Untitled") === key
      );
    }

    let mediaCoverageLoadToken = 0;
    const mediaCoveragePublicCache = new Map();

    function setMediaCoverageSummaryStatus(message, { error = false } = {}) {
      if (!mediaCoverageSummaryStatusEl) return;
      const text = String(message || "").trim();
      mediaCoverageSummaryStatusEl.hidden = !text;
      mediaCoverageSummaryStatusEl.textContent = text;
      mediaCoverageSummaryStatusEl.classList.toggle("is-error", Boolean(error && text));
    }

    function renderMediaCoverageStatBoard(rows, summaryOverrides = {}) {
      if (!mediaCoverageSummaryCardEl || !mediaCoverageSummaryTablesEl) return;
      mediaCoverageSummaryCardEl.hidden = false;
      mediaCoverageSummaryTablesEl.innerHTML = "";

      const cards = mediaCoverageSummaryCards(rows, { summaryOverrides });
      const featured = cards.filter((card) => card.featured);
      const rest = cards.filter((card) => !card.featured);

      const appendCard = (parent, card) => {
        const article = document.createElement("article");
        article.className = "media-coverage-stat-card";
        if (card.featured) article.classList.add("is-featured");
        article.dataset.statId = card.id;

        const icon = mediaCoveragePlatformIcon(card.platform);
        if (icon?.src) {
          const iconEl = document.createElement("span");
          iconEl.className = `media-coverage-stat-icon is-${card.platform}`;
          iconEl.setAttribute("aria-hidden", "true");
          iconEl.title = icon.label;
          const img = document.createElement("img");
          img.src = icon.src;
          img.alt = "";
          img.loading = "lazy";
          img.decoding = "async";
          iconEl.appendChild(img);
          article.appendChild(iconEl);
        }

        const valueEl = document.createElement("p");
        valueEl.className = "media-coverage-stat-value";
        valueEl.textContent = card.value;

        const labelEl = document.createElement("h4");
        labelEl.className = "media-coverage-stat-label";
        labelEl.textContent = card.label;

        const hintEl = document.createElement("p");
        hintEl.className = "media-coverage-stat-hint";
        hintEl.textContent = card.hint;

        article.appendChild(valueEl);
        article.appendChild(labelEl);
        article.appendChild(hintEl);
        parent.appendChild(article);
      };

      const featuredRow = document.createElement("div");
      featuredRow.className =
        "media-coverage-stat-row media-coverage-stat-row-featured";
      featured.forEach((card) => appendCard(featuredRow, card));

      const platformOrder = [
        { id: "youtube", label: "YouTube" },
        { id: "tiktok", label: "TikTok" },
        { id: "instagram", label: "Instagram" },
        { id: "bilibili", label: "BiliBili" },
        { id: "podcast", label: "Podcast" },
      ];
      const byPlatform = new Map();
      rest.forEach((card) => {
        const key = String(card.platform || "").trim().toLowerCase() || "other";
        if (!byPlatform.has(key)) byPlatform.set(key, []);
        byPlatform.get(key).push(card);
      });

      const wrap = document.createElement("div");
      wrap.className = "media-coverage-stat-board";
      wrap.appendChild(featuredRow);

      const appendPlatformSection = (platformId, label) => {
        const cardsForPlatform = byPlatform.get(platformId);
        if (!cardsForPlatform?.length) return;
        byPlatform.delete(platformId);
        const section = document.createElement("section");
        section.className = "media-coverage-stat-platform";
        section.dataset.platform = platformId;
        const heading = document.createElement("h4");
        heading.className = "media-coverage-stat-platform-title";
        heading.textContent = label;
        const grid = document.createElement("div");
        grid.className = "media-coverage-stat-grid";
        cardsForPlatform.forEach((card) => appendCard(grid, card));
        section.appendChild(heading);
        section.appendChild(grid);
        wrap.appendChild(section);
      };

      platformOrder.forEach(({ id, label }) => appendPlatformSection(id, label));
      [...byPlatform.keys()].forEach((id) => {
        const label = id.charAt(0).toUpperCase() + id.slice(1);
        appendPlatformSection(id, label);
      });

      mediaCoverageSummaryTablesEl.appendChild(wrap);
    }

    function applyMediaCoverageRows(raw, { loadError = "" } = {}) {
      const payload = String(raw || "");
      let rows = [];
      let summaryOverrides = {};
      try {
        rows = parseMediaCoverageValue(payload);
        summaryOverrides = parseMediaCoverageSummaryOverrides(payload);
      } catch {
        rows = [];
        summaryOverrides = {};
      }
      renderMediaCoverageStatBoard(rows, summaryOverrides);
      if (loadError && !rows.length) {
        setMediaCoverageSummaryStatus(loadError, { error: true });
      } else if (!rows.length) {
        setMediaCoverageSummaryStatus(
          "No media coverage saved for this game yet."
        );
      } else {
        setMediaCoverageSummaryStatus("");
      }
    }

    async function setGameLinkSections(entries) {
      const gameTitle =
        (entries[0]?.gameTitle || "").trim() || "Untitled";
      const token = ++mediaCoverageLoadToken;

      // Per-game cache: every Witch's Bakery announcement shows the same numbers.
      if (mediaCoveragePublicCache.has(gameTitle)) {
        applyMediaCoverageRows(
          String(mediaCoveragePublicCache.get(gameTitle) || "")
        );
        return;
      }

      // Show the board immediately (zeros) while the per-game payload loads.
      renderMediaCoverageStatBoard([]);
      setMediaCoverageSummaryStatus("Loading media coverage…");

      let raw = "";
      let loadError = "";
      try {
        const data = await loadPublicMediaCoverage(
          gameTitle,
          window.location.search
        );
        raw = String(data?.mediaCoverage || "").trim();
        mediaCoveragePublicCache.set(gameTitle, raw);
      } catch (error) {
        console.error(error);
        loadError =
          error instanceof Error
            ? error.message
            : "Could not load media coverage.";
        // Fall back to any coverage embedded on announcement rows.
        const gameRows = rowsForGameTitle(gameTitle);
        const sourceRows = gameRows.length ? gameRows : entries;
        raw =
          sourceRows
            .map((row) => String(row.mediaCoverage || "").trim())
            .find(Boolean) || "";
        if (raw) mediaCoveragePublicCache.set(gameTitle, raw);
      }

      if (token !== mediaCoverageLoadToken) return;
      applyMediaCoverageRows(raw, { loadError });
    }

    function closePdfViewer() {
      currentPdfUrl = "";
      pdfViewerEl.hidden = true;
      pdfViewerFrameEl.innerHTML = "";
    }

    function openPdfViewer(url) {
      const src = String(url || "").trim();
      if (!src) return;
      currentPdfUrl = src;
      pdfViewerFrameEl.innerHTML = "";
      const iframe = document.createElement("iframe");
      iframe.src = src;
      iframe.title = "Press release PDF";
      iframe.allow = "fullscreen";
      iframe.allowFullscreen = true;
      pdfViewerFrameEl.appendChild(iframe);
      pdfViewerEl.hidden = false;
      pdfViewerCloseBtn.focus();
    }

    function setPdf(entries) {
      const fullUrl = entries
        .map((row) => pdfEmbedUrl(row.pressReleasePdf, { toolbar: true }))
        .find(Boolean);
      const previewUrl = fullUrl
        ? withPdfViewerChrome(fullUrl, { toolbar: false })
        : "";

      const existing = pdfEmbedEl.querySelector("iframe");
      if (existing) existing.remove();
      closePdfViewer();

      if (previewUrl && fullUrl) {
        const iframe = document.createElement("iframe");
        iframe.className = "pdf-preview-frame";
        iframe.src = previewUrl;
        iframe.title = "Press release PDF";
        iframe.allow = "fullscreen";
        iframe.allowFullscreen = true;
        pdfEmbedEl.appendChild(iframe);
        pdfPlaceholderEl.hidden = true;
        pdfExpandBtn.hidden = false;
        pdfExpandBtn.onclick = () => openPdfViewer(fullUrl);
        pdfCardEl.classList.remove("is-empty");
      } else {
        pdfPlaceholderEl.hidden = false;
        pdfExpandBtn.hidden = true;
        pdfExpandBtn.onclick = null;
        pdfCardEl.classList.add("is-empty");
      }
    }

    function slidesFromRows(rows) {
      return [...rows].sort((a, b) => {
        const gameA = (a.gameTitle || "").trim() || "Untitled";
        const gameB = (b.gameTitle || "").trim() || "Untitled";
        const gameCmp = gameA.localeCompare(gameB, undefined, {
          sensitivity: "base",
          numeric: true,
        });
        if (gameCmp !== 0) return gameCmp;
        const titleA = (a.announcementTitle || "").trim();
        const titleB = (b.announcementTitle || "").trim();
        return titleA.localeCompare(titleB, undefined, {
          sensitivity: "base",
          numeric: true,
        });
      });
    }

    function gameImageForTitle(gameTitle, rows = allPublicRows) {
      const key = (gameTitle || "").trim() || "Untitled";
      for (const row of rows || []) {
        const title = (row.gameTitle || "").trim() || "Untitled";
        if (title.toLowerCase() !== key.toLowerCase()) continue;
        const image = String(row.gameImage || "").trim();
        if (image) return image;
      }
      return "";
    }

    function setCoverError(message) {
      if (!coverErrorEl) return;
      const text = String(message || "").trim();
      coverErrorEl.textContent = text;
      coverErrorEl.hidden = !text;
    }

    function showCoverImage(gameTitle, row) {
      const rowImage = String(row?.gameImage || "").trim();
      const sharedImage = gameImageForTitle(gameTitle);
      const imageUrl = rowImage || sharedImage;
      setCoverError("");

      if (imageUrl) {
        gameImageEl.onload = () => {
          setCoverError("");
          coverPlaceholderEl.hidden = true;
          coverBannerEl.classList.remove("is-empty");
          coverBannerEl.setAttribute("aria-hidden", "false");
        };
        gameImageEl.onerror = () => {
          gameImageEl.hidden = true;
          gameImageEl.removeAttribute("src");
          coverPlaceholderEl.hidden = false;
          coverBannerEl.classList.add("is-empty");
          coverBannerEl.setAttribute("aria-hidden", "true");
          const shortUrl =
            imageUrl.length > 120 ? `${imageUrl.slice(0, 117)}…` : imageUrl;
          setCoverError(
            `Cover image URL failed to load for “${gameTitle}”. Browser could not fetch: ${shortUrl}. Check the Worker/R2 URL, or re-upload in Admin.`
          );
        };
        gameImageEl.src = imageUrl;
        gameImageEl.alt = gameTitle;
        gameImageEl.hidden = false;
        coverPlaceholderEl.hidden = true;
        coverBannerEl.classList.remove("is-empty");
        coverBannerEl.setAttribute("aria-hidden", "false");
        return;
      }

      gameImageEl.removeAttribute("src");
      gameImageEl.alt = "";
      gameImageEl.hidden = true;
      coverPlaceholderEl.hidden = false;
      coverBannerEl.classList.add("is-empty");
      coverBannerEl.setAttribute("aria-hidden", "true");
      setCoverError(
        `No cover image found for “${gameTitle}”. This announcement’s gameImage field is empty in the API, and no other announcement for this game has one either. Re-upload the cover in Admin (game settings) and wait for Save to finish.`
      );
    }

    function slideGameKey(row) {
      return String(row?.gameTitle || "").trim() || "Untitled";
    }

    function slideLabel(row) {
      const gameTitle = slideGameKey(row);
      const announcementTitle = (row.announcementTitle || "").trim();
      return announcementTitle
        ? `${gameTitle}: ${announcementTitle}`
        : gameTitle;
    }

    /** First slide index of the previous/next distinct game, or -1. */
    function adjacentGameIndex(fromIndex, dir) {
      if (!slides.length) return -1;
      const currentKey = slideGameKey(slides[fromIndex]).toLowerCase();
      if (dir < 0) {
        for (let i = fromIndex - 1; i >= 0; i -= 1) {
          if (slideGameKey(slides[i]).toLowerCase() !== currentKey) {
            const key = slideGameKey(slides[i]).toLowerCase();
            let start = i;
            while (
              start > 0 &&
              slideGameKey(slides[start - 1]).toLowerCase() === key
            ) {
              start -= 1;
            }
            return start;
          }
        }
        return -1;
      }
      for (let i = fromIndex + 1; i < slides.length; i += 1) {
        if (slideGameKey(slides[i]).toLowerCase() !== currentKey) return i;
      }
      return -1;
    }

    /** Previous/next announcement within the same game, or -1. */
    function adjacentAnnouncementIndex(fromIndex, dir) {
      if (!slides.length) return -1;
      const next = fromIndex + dir;
      if (next < 0 || next >= slides.length) return -1;
      if (
        slideGameKey(slides[next]).toLowerCase() !==
        slideGameKey(slides[fromIndex]).toLowerCase()
      ) {
        return -1;
      }
      return next;
    }

    function showSlide(index) {
      if (!slides.length) return;
      if (index < 0 || index >= slides.length) return;

      activeIndex = index;
      const row = slides[activeIndex];
      const entries = [row];
      const gameTitle = slideGameKey(row);
      const announcementTitle = (row.announcementTitle || "").trim();

      gameEl.textContent = gameTitle;
      const hasAnnouncementSiblings =
        adjacentAnnouncementIndex(activeIndex, -1) >= 0 ||
        adjacentAnnouncementIndex(activeIndex, 1) >= 0;
      const monthYear =
        String(row.month || "").trim() || monthFromDate(row.date) || "";
      subtitleEl.textContent = announcementTitle;
      if (carouselAnnouncementDateEl) {
        carouselAnnouncementDateEl.textContent = monthYear;
        carouselAnnouncementDateEl.hidden = !monthYear;
      }
      if (carouselSubtitleRowEl) {
        carouselSubtitleRowEl.hidden = !(
          announcementTitle ||
          hasAnnouncementSiblings ||
          monthYear
        );
      }
      syncCarouselNavButtons();
      showCoverImage(gameTitle, row);
      estimatedReachEl.innerHTML = "";
      totalWishlistsEl.innerHTML = "";

      const reach = (row.estimatedReach || "").trim();
      const reachLi = document.createElement("li");
      reachLi.textContent = reach ? formatCoverageStat(reach) : "No data";
      if (!reach) reachLi.classList.add("is-empty");
      estimatedReachEl.appendChild(reachLi);

      const wishlists = (row.totalWishlists || "").trim();
      const hasWishlists =
        wishlists && !/^(no data|n\/a|na|-|—|–)$/i.test(wishlists);
      if (hasWishlists) {
        const wishlistsLi = document.createElement("li");
        wishlistsLi.textContent = formatCoverageStat(wishlists);
        totalWishlistsEl.appendChild(wishlistsLi);
        if (totalWishlistsCardEl) totalWishlistsCardEl.hidden = false;
      } else if (totalWishlistsCardEl) {
        totalWishlistsCardEl.hidden = true;
      }

      setPlatforms(entries);
      setTrailer(entries);
      setPdf(entries);
      setCoverageLinks(entries);
      void setGameLinkSections(entries);
    }

    function syncCarouselNavButtons() {
      const prevGame = adjacentGameIndex(activeIndex, -1);
      const nextGame = adjacentGameIndex(activeIndex, 1);
      const prevAnnouncement = adjacentAnnouncementIndex(activeIndex, -1);
      const nextAnnouncement = adjacentAnnouncementIndex(activeIndex, 1);

      carouselEl.querySelectorAll(".carousel-nav-btn").forEach((btn) => {
        const kind = btn.getAttribute("data-carousel-nav");
        const dir = Number(btn.getAttribute("data-carousel-dir") || 0);
        let target = -1;
        if (kind === "game") {
          target = dir < 0 ? prevGame : nextGame;
        } else if (kind === "announcement") {
          target = dir < 0 ? prevAnnouncement : nextAnnouncement;
        }
        const show = target >= 0;
        btn.hidden = !show;
        btn.disabled = !show;
        btn.dataset.targetIndex = show ? String(target) : "";
      });
    }

    function render(rows) {
      allPublicRows = Array.isArray(rows) ? rows : [];
      slides = slidesFromRows(rows);

      if (!slides.length) {
        carouselEl.hidden = true;
        carouselEl.classList.remove("is-ready");
        gameImageEl.removeAttribute("src");
        gameImageEl.hidden = true;
        coverPlaceholderEl.hidden = false;
        coverBannerEl.classList.add("is-empty");
        coverBannerEl.setAttribute("aria-hidden", "true");
        const params = new URLSearchParams(window.location.search);
        const filtered =
          params.has("game") ||
          params.has("games") ||
          params.has("month") ||
          params.has("months") ||
          params.has("s");
        statusEl.hidden = false;
        statusEl.textContent = filtered
          ? "No announcements match this filter."
          : "No announcements published yet.";
        return;
      }

      statusEl.textContent = "";
      statusEl.hidden = true;

      try {
        showSlide(0);
        carouselEl.hidden = false;
        carouselEl.classList.add("is-ready");
      } catch (error) {
        console.error(error);
        carouselEl.hidden = true;
        carouselEl.classList.remove("is-ready");
        statusEl.hidden = false;
        statusEl.textContent =
          error instanceof Error
            ? error.message
            : "Could not render announcements.";
        statusEl.classList.add("is-error");
      }
    }

    function navigateCarousel(dir) {
      const step = dir < 0 ? -1 : 1;
      const nextAnnouncement = adjacentAnnouncementIndex(activeIndex, step);
      if (nextAnnouncement >= 0) {
        showSlide(nextAnnouncement);
        return;
      }
      const nextGame = adjacentGameIndex(activeIndex, step);
      if (nextGame < 0) return;
      if (step > 0) {
        showSlide(nextGame);
        return;
      }
      // Land on the last announcement of the previous game.
      const key = slideGameKey(slides[nextGame]).toLowerCase();
      let last = nextGame;
      while (
        last + 1 < slides.length &&
        slideGameKey(slides[last + 1]).toLowerCase() === key
      ) {
        last += 1;
      }
      showSlide(last);
    }

    carouselEl.addEventListener("click", (event) => {
      const btn = event.target.closest?.("[data-carousel-nav]");
      if (!btn || !carouselEl.contains(btn) || btn.hidden || btn.disabled) return;
      const target = Number(btn.dataset.targetIndex);
      if (!Number.isFinite(target) || target < 0) return;
      event.preventDefault();
      showSlide(target);
    });

    carouselEl.addEventListener("keydown", (event) => {
      if (!pdfViewerEl.hidden) {
        if (event.key === "Escape") {
          event.preventDefault();
          closePdfViewer();
        }
        return;
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        navigateCarousel(1);
      } else if (event.key === "ArrowLeft") {
        event.preventDefault();
        navigateCarousel(-1);
      }
    });

    pdfViewerCloseBtn.addEventListener("click", () => closePdfViewer());
    pdfViewerEl.addEventListener("click", (event) => {
      if (event.target === pdfViewerEl) closePdfViewer();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !pdfViewerEl.hidden) {
        event.preventDefault();
        closePdfViewer();
      }
    });

    carouselEl.addEventListener(
      "touchstart",
      (event) => {
        touchStartX = event.changedTouches[0]?.clientX ?? 0;
      },
      { passive: true }
    );

    carouselEl.addEventListener(
      "touchend",
      (event) => {
        const touchEndX = event.changedTouches[0]?.clientX ?? 0;
        const delta = touchEndX - touchStartX;
        if (Math.abs(delta) < 40) return;
        navigateCarousel(delta < 0 ? 1 : -1);
      },
      { passive: true }
    );

    const publicAppEl = document.getElementById("public-app");
    const publicGateEl = document.getElementById("public-gate");
    const hasAccessKey = Boolean(
      String(window.location.search || "")
        .replace(/^\?/, "")
        .trim()
    );

    if (!hasAccessKey) {
      statusEl.hidden = true;
      statusEl.textContent = "";
      carouselEl.hidden = true;
      carouselEl.classList.remove("is-ready");
      if (publicGateEl) publicGateEl.hidden = false;
      publicAppEl?.classList.add("is-gate");
    } else {
      try {
        statusEl.textContent = "Loading announcements…";
        statusEl.hidden = false;
        carouselEl.hidden = true;
        carouselEl.classList.remove("is-ready");
        if (publicGateEl) publicGateEl.hidden = true;
        publicAppEl?.classList.remove("is-gate");
        const data = await loadPublicAnnouncements(window.location.search);
        render(data.rows || []);
      } catch (error) {
        console.error(error);
        carouselEl.hidden = true;
        carouselEl.classList.remove("is-ready");
        statusEl.hidden = false;
        statusEl.textContent =
          error instanceof Error
            ? error.message
            : "Could not load announcements.";
        statusEl.classList.add("is-error");
      }
    }
  </script>
</body>
</html>
