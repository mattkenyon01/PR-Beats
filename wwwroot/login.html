<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin login — PR beats</title>
  <script src="js/theme-boot.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button type="button" class="theme-toggle" data-theme-toggle>
    <span data-theme-label>Dark</span>
  </button>
  <div class="login">
    <h1>PR beats</h1>
    <p>Admin login</p>

    <form id="login-form" action="#" method="post">
      <label>
        Email
        <input id="email" type="email" name="email" autocomplete="username" required />
      </label>
      <label>
        Password
        <span class="password-field">
          <input id="password" type="password" name="password" autocomplete="current-password" required />
          <button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7.5C2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 .001 6.001A3 3 0 0 0 12 9.5z"/>
            </svg>
            <svg class="icon-eye-off" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M2.1 3.51 3.51 2.1l18.38 18.39-1.41 1.41-3.28-3.28A12.3 12.3 0 0 1 12 20c-5 0-9.27-3.11-11-7.5a12.7 12.7 0 0 1 4.3-5.37L2.1 3.51zM12 9a3 3 0 0 1 2.96 3.48l-3.44-3.44c.15-.03.31-.04.48-.04zm0-4c5 0 9.27 3.11 11 7.5a12.6 12.6 0 0 1-4.08 5.1l-1.5-1.5A10.4 10.4 0 0 0 21.1 12.5C19.5 9.1 16 7 12 7c-.7 0-1.37.08-2.02.22L8.3 5.54A12.4 12.4 0 0 1 12 5zM7.05 9.17A5 5 0 0 0 12 17a4.9 4.9 0 0 0 2.55-.7l-1.6-1.6A3 3 0 0 1 9.3 10.77L7.05 9.17z"/>
            </svg>
          </button>
        </span>
      </label>
      <button id="submit-btn" type="submit">Sign in</button>
    </form>

    <p class="message error" id="error" hidden></p>
    <p class="note" id="setup-note" hidden>
      Add your Firebase web config in <code>firebase-config.js</code>, enable Email/Password auth,
      and create a user in the Firebase Console.
    </p>
    <a class="back" href="index.html">Back to site</a>
  </div>

  <script type="module">
    import { initThemeToggle } from "./js/theme.js";
    import {
      getFirebaseAuth,
      isFirebaseConfigured,
      onAuthStateChanged,
      signInWithEmailAndPassword,
      friendlyAuthError,
    } from "./js/firebase-app.js";

    initThemeToggle();

    const form = document.getElementById("login-form");
    const errorEl = document.getElementById("error");
    const setupNote = document.getElementById("setup-note");
    const submitBtn = document.getElementById("submit-btn");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");

    togglePassword.addEventListener("click", () => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      togglePassword.classList.toggle("is-showing", !showing);
      togglePassword.setAttribute("aria-pressed", showing ? "false" : "true");
      togglePassword.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    if (!isFirebaseConfigured()) {
      setupNote.hidden = false;
      submitBtn.disabled = true;
    } else {
      const auth = getFirebaseAuth();

      onAuthStateChanged(auth, (user) => {
        if (user) {
          window.location.replace("admin.html");
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        showError("");
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          await signInWithEmailAndPassword(auth, email, password);
          window.location.replace("admin.html");
        } catch (error) {
          showError(friendlyAuthError(error));
          submitBtn.disabled = false;
          submitBtn.textContent = "Sign in";
        }
      });
    }
  </script>
</body>
</html>
